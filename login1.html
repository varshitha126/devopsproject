<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset="UTF-8">
    <title>Login Detail</title>
    <style>
        /* Increases the font size for the body text, inputs, select dropdowns, and buttons */
        body, input, select, button {
            font-size: 18px; 
        }
        h1 {
            font-size: 32px;
        }
    </style>
</head>
<body>
<h1> Login Detail</h1>
<form action=# method="post">
    <!-- Username Validation: Required, 3-20 characters -->
    <label for="uname"><b>Username</b></label>
    <input type="text" placeholder="Enter Username" name="uname" minlength="3" maxlength="20" required><br><br>

    <!-- Password Validation: Required, min 8 chars, at least 1 letter and 1 number -->
    <label for="psw"><b>Password</b></label>
    <input type="password" placeholder="Enter Password" name="psw" 
           pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" 
           title="Must contain at least one number, one uppercase and lowercase letter, and at least 8 or more characters" 
           required><br><br>

    <!-- Phone Number Validation: Required, must be exactly 10 digits -->
    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" name="phone" placeholder="Enter 10-digit number" 
           pattern="[0-9]{10}" title="Please enter a valid 10-digit phone number" required><br><br>

    <!-- Email Validation: Required, must be valid email format -->
    <label for="email">Enter your email:</label>
    <input type="email" id="email" name="email" placeholder="Enter email Address" required><br><br>

    <!-- Gender Section: Required -->
    <label>GENDER:</label><br>
    <input type="radio" id="male" name="gender" value="male" required>
    <label for="male">Male</label><br>
    <input type="radio" id="female" name="gender" value="female">
    <label for="female">Female</label><br>
    <input type="radio" id="other" name="gender" value="other">
    <label for="other">Other</label><br><br>

    <!-- Event Selection: Required selection -->
    <label for="EVENT">Select event:</label>
    <select id="event" name="event" required>
        <option value="">--select an event--</option>
        <option value="seminar">Seminar</option>
        <option value="workshop">Workshop</option>
        <option value="hackothon">Hackothon</option>
    </select>
    <br><br>

    <input type="submit" value="register">
    <input type="reset" value="reset">
</form>
</body>
</html>
